name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.11-bookworm
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4

      - name: Install system fonts
        run: |
          apt-get update
          apt-get install -y fonts-dejavu-core fontconfig
          fc-cache -fv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      - name: Run Security Scan with Bandit
        run: |
          bandit -r module -ll -o bandit-report.txt -f txt
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: warn

      - name: Run tests
        run: |
          pytest -q \
            --cov=module \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload image comparison artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-comparison-artifacts
          path: |
            test_artifacts/result_images/**
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build Code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
