name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg            # headless + deterministic
      MPLCONFIGDIR: /tmp/mpl     # avoid font cache perms weirdness

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      - name: Print render environment (debug)
        run: |
          python - <<'PY'
          import matplotlib as mpl, numpy as np, PIL, sys
          from matplotlib import ft2font
          print("Python:", sys.version.split()[0])
          print("Matplotlib:", mpl.__version__, "Backend:", mpl.get_backend())
          print("NumPy:", np.__version__)
          print("Pillow:", PIL.__version__)
          print("FreeType:", ft2font.__freetype_version__)
          print("Font family:", mpl.rcParams.get("font.family"))
          PY

      - name: Run tests (pytest-mpl)
        run: |
          pytest -q \
            --cov=module \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build Code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
